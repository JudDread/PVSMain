# Auto-deploys the Edge Function named "game" to Supabase.
# Runs when the function's code (or this file) changes, or when started by hand.
# The only secret is SUPABASE_ACCESS_TOKEN, stored in the repo's Actions secrets.
# Database migrations are NOT run here - those stay manual.

name: Deploy game function

on:
  push:
    paths:
      - 'supabase/functions/game/**'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: krallhjvjjeeypdpnjha

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy game --project-ref $PROJECT_ID
